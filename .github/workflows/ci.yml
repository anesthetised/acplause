name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: just check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'

      - name: Install Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2

      - name: Install git-cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          version: v2.14.2
          args: --unreleased --strip all
        env:
          OUTPUT: ${{ runner.temp }}/cliff-setup.md

      - name: Add git-cliff to PATH
        run: echo "$RUNNER_TEMP/git-cliff/bin" >> "$GITHUB_PATH"

      - name: Check
        run: just check -coverprofile="$RUNNER_TEMP/coverage.out"

      - name: Read coverage
        id: coverage
        run: |
          coverage=$(go tool cover -func="$RUNNER_TEMP/coverage.out" | awk '/^total:/ {print $3}')
          echo "coverage=$coverage" >> "$GITHUB_OUTPUT"
          if awk -v c="${coverage%\%}" 'BEGIN { exit !(c < 80) }'; then
            echo "::error::Go coverage $coverage is below 80%"
            exit 1
          fi

  coverage:
    name: Publish coverage badge
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write # the badges branch
    steps:
      # The README badge reads coverage.json from the `badges` branch via
      # shields.io; the branch holds one commit, replaced on every push.
      - name: Publish the coverage badge
        env:
          GH_TOKEN: ${{ github.token }}
          COVERAGE: ${{ needs.check.outputs.coverage }}
        run: |
          pct=${COVERAGE%\%}
          color=$(awk -v p="$pct" 'BEGIN { print (p >= 80 ? "brightgreen" : p >= 60 ? "yellow" : "red") }')
          mkdir badge && cd badge
          printf '{"schemaVersion":1,"label":"Go coverage","message":"%s%%","color":"%s"}\n' "$pct" "$color" > coverage.json
          git init -q -b badges
          git add coverage.json
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -q -m "coverage $pct%"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" badges

  windows:
    name: Windows amd64 tests
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: '1'
      CC: gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify the race detector compiler runtime
        shell: pwsh
        run: |
          $library = gcc --print-file-name=libsynchronization.a
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $library -PathType Leaf)) {
            throw 'The Windows race detector requires MinGW-w64 runtime 8 or later'
          }
          gcc --version

      - name: Vet
        run: go vet ./...

      # Bound concurrency across packages as well as within each package:
      # overlapping e2e and unit shells can starve PowerShell startup on the
      # shared runner. Retain the tests' existing streaming deadlines.
      - name: Unit and protocol e2e tests
        run: go test -race -count=1 -p=1 -parallel=4 ./...

      - name: Build native release binary
        run: go build -o "${{ runner.temp }}/acplause.exe" ./cmd/acplause
        env:
          CGO_ENABLED: '0'

      # This verifies arm64 production and test compilation; it does not claim
      # to execute arm64 binaries on the amd64 runner. 'go test -c' never runs
      # TestMain, so its fixture builds remain native in the test step above.
      - name: Cross-build Windows arm64 binary and tests
        shell: pwsh
        env:
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          go build -o "${{ runner.temp }}/acplause-arm64.exe" ./cmd/acplause
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -c -o "${{ runner.temp }}/arm64-tests/" ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
